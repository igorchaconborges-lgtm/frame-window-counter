name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Fixed Bindings
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "bindings"
          git clone --depth 1 https://github.com/geode-sdk/bindings.git $dest
          
          # Fix 1: Sintaxis en GeometryDash.bro linea 7059
          $bro = Join-Path $dest "bindings/2.208/GeometryDash.bro"
          if (Test-Path $bro) {
            (Get-Content $bro -Raw) -replace 'm1 = 0x4beb30, imac = 0x570dd0', 'm1 0x4beb30, imac 0x570dd0' | Set-Content $bro
          }
          
          # Fix 2: Habilitar LeaderboardState en GD 2.208+
          $enums = Join-Path $dest "bindings/include/Geode/Enums.hpp"
          if (Test-Path $enums) {
            (Get-Content $enums -Raw) -replace '#if GEODE_COMP_GD_VERSION < 22080', '#if 1' | Set-Content $enums
          }

          "GEODE_BINDINGS_REPO_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Mod with Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-${{ matrix.config.name }}
          path: |
            build/**/*.geode
            *.geode

  package:
    name: Package Universal Mod (Windows + Android)
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine Builds into Universal Mod
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload Universal Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-universal
          path: ${{ steps.combine.outputs.build-output }}
